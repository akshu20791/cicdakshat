name: CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:

permissions:
  contents: read
  packages: write

jobs:

  # ==================================================
  # JOB 1: BUILD & TEST
  # ==================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      # Step 1: Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # Step 3: Build application
      - name: Build with Maven
        run: mvn -B clean package

      # Step 4: Run tests
      - name: Run tests
        run: mvn -q test

      # Step 5: Save JAR for Docker job
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar


  # ==================================================
  # JOB 2: DOCKER BUILD & PUSH
  # ==================================================
  docker:
    name: Build and Push Docker Image

    # Docker job starts only after Build succeeds
    needs: build

    runs-on: ubuntu-latest

    # Don't push Docker image for Pull Requests
    if: github.event_name != 'pull_request'

    steps:

      # Step 1: Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Download JAR created by Build job
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      # Step 3: Set up QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/cicdakshat:latest
            ghcr.io/${{ github.repository_owner }}/cicdakshat:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
